<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
</head>
<body>
       <header>
        <h1>form</h1>
       </header>
    <div class="container">

    <form>

        <div class="form-row">
            <label>Full Name</label>

            <div class="two-inputs">
                <div>
                    <input type="text">
                    <small>First Name</small>
                </div>

                <div>
                    <input type="text">
                    <small>Last Name</small>
                </div>
            </div>
        </div>


        <div class="form-row">
            <label>Email</label>

            <div>
                <input type="email" class="full-input">
            </div>
        </div>


        <div class="form-row">
            <label>Phone Number</label>

            <div class="phone">
                <div>
                    <input type="text">
                    <small>Area Code</small>
                </div>

                <span>-</span>

                <div>
                    <input type="text">
                    <small>Phone Number</small>
                </div>
            </div>
        </div>


        <div class="form-row">
            <label>Company</label>

            <div>
                <input type="text" class="full-input">
            </div>
        </div>


        <div class="form-row">
            <label>Type of Business</label>

            <div class="checks four">

                <label><input type="checkbox"> Technology</label>
                <label><input type="checkbox"> Food</label>
                <label><input type="checkbox"> Beauty</label>
                <label><input type="checkbox"> Finance</label>

            </div>
        </div>


        <div class="form-row">
            <label>Type of Website You Need</label>

            <div class="checks four">

                <label><input type="checkbox"> Personal</label>
                <label><input type="checkbox"> Educational</label>
                <label><input type="checkbox"> Sport</label>
                <label><input type="checkbox"> Food</label>

                <label><input type="checkbox"> Local Business</label>
                <label><input type="checkbox"> Small Business</label>
                <label><input type="checkbox"> Medium Business</label>

            </div>
        </div>


        <div class="form-row">
            <label>Navigation Bar Item</label>

            <div class="checks three">

                <label><input type="checkbox"> About</label>
                <label><input type="checkbox"> FAQ</label>
                <label><input type="checkbox"> User Guide</label>

                <label><input type="checkbox"> Forum</label>
                <label><input type="checkbox"> Blog</label>
                <label><input type="checkbox"> Pricing</label>

            </div>
        </div>


        <div class="form-row">
            <label>More Items</label>

            <input type="text" class="full-input">
        </div>


        <div class="form-row">
            <label>Additional Services</label>

            <div class="checks three">

                <label><input type="checkbox"> Banner Design</label>
                <label><input type="checkbox"> SEO</label>
                <label><input type="checkbox"> Landing Page Design</label>

                <label><input type="checkbox"> Video</label>
                <label><input type="checkbox"> Analytics</label>
                <label><input type="checkbox"> Advertisement Management</label>

            </div>
        </div>


        <div class="form-row">
            <label>Additional Comments</label>

            <textarea></textarea>
        </div>

    </form>

</div>




</body>
</html>
